<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Homework #10 — Interactive Story</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive non-linear story">

  <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #DCD0FF;
      --accent: #8c63ff;
      --card-bg: #ffffff;
    }

    body {
      margin: 0;
      padding-left: 60px;
      font-family: "Times New Roman", serif;
      background: var(--bg);
      color: #2b2340;
    }

    .scrollbar {
      position: fixed;
      left: 0;
      top: 0;
      width: 60px;
      height: 100%;
      background: #E0D0FF;
      display: flex;
      justify-content: center;
      padding-top: 20px;
    }

    .heart {
      font-size: 30px;
      cursor: pointer;
    }

    .nav {
      background: white;
      padding: 10px;
      display: flex;
      gap: 20px;
      position: sticky;
      top: 0;
    }

    .nav a {
      text-decoration: none;
      color: var(--accent);
    }

    h1 {
      font-family: 'Lobster', cursive;
      margin: 20px;
    }

    .story-wrap {
      max-width: 900px;
      margin: 20px;
    }

    .story-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 5px 6px 14px rgba(0,0,0,0.15);
    }

    #scene-image {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .scene-text {
      font-size: 1.2rem;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice-btn {
      background: linear-gradient(180deg,#bfa8ff,#8c63ff);
      border: none;
      color: white;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      text-align: left;
    }

    .choice-btn:hover {
      opacity: 0.9;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    .ctrl-btn {
      background: white;
      border: 1px solid #ccc;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      body {
        padding-left: 0;
      }
      .scrollbar {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="scrollbar">
    <div class="heart">❤️</div>
  </div>

  <div class="nav">
    <a href="index.html">Home</a>
    <a href="homework.html">Homework</a>
    <a href="readings.html">Readings</a>
  </div>

  <h1>Homework 10: Interactive Story</h1>

  <div class="story-wrap">
    <div class="story-card">

      <img id="scene-image" src="subway.jpg" alt="Story scene">

      <div class="scene-text" id="scene-text"></div>

      <div class="choices" id="choices"></div>

      <div class="controls">
        <button class="ctrl-btn" id="restart-btn">Restart</button>
      </div>

    </div>
  </div>

  <script>
    const scenes = {
      start: {
        image: "subway.jpg",
        text: "Hmm… I only have $50 left. Standing in the subway, everything looks tempting. What should I do?",
        choices: [
          { text: "A. Go to the mall and treat myself", next: "mall" },
          { text: "B. Walk toward Brooklyn Bridge to think", next: "bridge" },
          { text: "C. Go straight home and save my money", next: "home" }
        ]
      },

      mall: {
        image: "mall.jpg",
        text: "The mall is bright and loud. Sales everywhere. I can feel my money slipping away.",
        choices: [
          { text: "A. Buy shoes and snacks", next: "overspend" },
          { text: "B. Just look and leave", next: "bridge" },
          { text: "C. Change my mind and go home", next: "home" }
        ]
      },

      bridge: {
        image: "bridge.jpg",
        text: "Standing on Brooklyn Bridge, the city feels big. This $50 could matter later.",
        choices: [
          { text: "A. Invest the money for my future", next: "invest" },
          { text: "B. Spend it anyway — I’m stressed", next: "overspend" },
          { text: "C. Go home and save it", next: "home" }
        ]
      },

      overspend: {
        image: "overspend.jpg",
        text: "I spent it all. It felt good for a moment… but now my wallet is empty.",
        choices: [
          { text: "Restart the story", next: "start" }
        ]
      },

      invest: {
        image: "invest.jpg",
        text: "I invest the $50. It’s not much, but it feels like choosing my future.",
        choices: [
          { text: "Restart the story", next: "start" }
        ]
      },

      home: {
        image: "home.jpg",
        text: "I go home and save my money. Quiet, simple, and responsible.",
        choices: [
          { text: "Restart the story", next: "start" }
        ]
      }
    };

    let current = "start";

    function renderScene(id) {
      const scene = scenes[id];
      if (!scene) return;

      document.getElementById("scene-image").src = scene.image;
      document.getElementById("scene-text").textContent = scene.text;

      const choicesEl = document.getElementById("choices");
      choicesEl.innerHTML = "";

      scene.choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = choice.text;
        btn.onclick = () => renderScene(choice.next);
        choicesEl.appendChild(btn);
      });

      current = id;
    }

    document.getElementById("restart-btn").onclick = () => renderScene("start");

    renderScene("start");
  </script>

</body>
</html>
