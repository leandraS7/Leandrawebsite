<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Homework 10 placeholder">
  <title>Homework #10 (Coming Soon)</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">

  <style>
    /* Body and background */
    body {
      margin: 0;
      padding: 0;
      background-color: #DCD0FF; /* Lilac light purple */
      font-family: "Times New Roman", serif;
      color: #2b2340;
      min-height: 100vh;
      /* leave space for fixed left sidebar */
      padding-left: 60px;
      box-sizing: border-box;
    }

    /* Real browser scrollbar styling (WebKit + Firefox) */
    /* WebKit browsers */
    ::-webkit-scrollbar {
      width: 14px;
    }
    ::-webkit-scrollbar-track {
      background: #efe8ff; /* pale lilac track */
      border-left: 1px solid rgba(0,0,0,0.03);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #c4a8ff, #8c63ff);
      border-radius: 12px;
      border: 3px solid #efe8ff; /* padding look */
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #af85ff, #6f3cff);
    }

    /* Firefox */
    scrollbar-width: thin;
    scrollbar-color: #8c63ff #efe8ff;

    /* Sidebar with heart (left fixed) */
    .scrollbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 60px;
      height: 100%;
      background: #E0D0FF;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 20px;
      transition: background 0.3s;
      z-index: 100;
    }

    .scrollbar .heart {
      font-size: 30px;
      cursor: pointer;
      color: #FF69B4; /* pink heart */
      transition: transform 0.2s;
      user-select: none;
    }

    /* Top navigation */
    .nav {
      display: flex;
      gap: 18px;
      align-items: center;
      background: #fff;
      padding: 10px 16px;
      margin-left: 60px;
      position: sticky;
      top: 0;
      z-index: 90;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .nav a, .nav button { color: #6ea9ff; font-size: 1em; background: none; border: none; cursor: pointer; text-decoration: none; }
    .nav .home-link { color: #6ea9ff; text-decoration: none; }

    h1, h2, h3, h4, h5, h6 { font-family: 'Lobster', cursive; margin-left: 60px; }

    p { margin-left: 60px; max-width: 900px; line-height: 1.5; }

    /* Polaroid common style */
    .polaroid { background: white; padding: 10px 10px 30px 10px; box-shadow: 5px 5px 10px rgba(0,0,0,0.18); display: inline-block; position: relative; transition: transform 0.25s, box-shadow 0.25s; border-radius: 4px; text-align: center; color: #222; text-decoration: none; margin: 8px; }
    .polaroid .caption { margin-top: 8px; font-size: 0.95em; color: #444; }

    @media (max-width: 600px) { body { padding-left: 0; } .scrollbar { display: none; } h1, .nav, p { margin-left: 12px; } }
  </style>
</head>
<body>

  <div class="scrollbar">
    <div class="heart" title="Like">❤️</div>
  </div>

  <!-- Top navigation -->
  <div class="nav">
    <a class="home-link" href="homework.html">Homework</a>
    <a class="home-link" href="readings.html">Readings</a>
    <a class="home-link" href="index.html">Home</a>
  </div>

  <h1>Homework 10: Interactive Story (Coming Soon)</h1>
  <div class="polaroid"><div class="caption">Thumbnail coming soon</div></div>
  <p>This homework page is not published yet — check back later.</p>

  <script>
    // Heart click effect
    const heart = document.querySelector('.heart');
    heart && heart.addEventListener('click', () => { heart.style.transform = 'scale(1.2)'; setTimeout(() => heart.style.transform = '', 250); });
  </script>
</body>
</html>
