<!DOCTYPE html>
<html>
<head>
  <title>Homework #2</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="this is the second homework assigment for FA25 MEDP150">

  <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
  <style>
    body {
      margin:0;
      padding:0;
      background:#DCD0FF;
      font-family:"Times New Roman", serif;
      color:#2b2340;
      min-height:100vh;
      padding-left:60px;
      box-sizing:border-box;
    }

    .polaroid {
      display:inline-block;
      background:#fff;
      padding:10px 10px 26px 10px;
      box-shadow:4px 6px 12px rgba(0,0,0,0.15);
      margin:8px;
      border-radius:4px;
      text-align:center;
    }

    .polaroid img {
      width:400px;     /* display size only */
      height:auto;
      display:block;
      border-radius:2px;
    }

    .caption {
      font-size:0.9em;
      color:#333;
      margin-top:8px;
    }
  </style>
</head>

<body>

<h1>Homework 2: Cropping and Resizing</h1>

<!-- POLAROID THUMBNAILS (click = full resolution) -->
<div class="polaroid">
  <a href="Flower2.jpg" target="_blank">
    <img src="Flower.jpg" alt="Flower">
  </a>
  <div class="caption">Flower</div>
</div>

<div class="polaroid">
  <a href="Layla2.jpg" target="_blank">
    <img src="Layla.jpg" alt="Layla">
  </a>
  <div class="caption">Layla</div>
</div>

<!-- INLINE IMAGES (also clickable to full size) -->
<a href="Flower.jpg" target="_blank">
  <img src="Flower.jpg" width="400" alt="Flower">
</a>

<a href="Flower2.jpg" target="_blank">
  <img src="Flower2.jpg" width="400" alt="Flower2">
</a>

<a href="Layla.jpg" target="_blank">
  <img src="Layla.jpg" width="400" alt="Layla">
</a>

<a href="Layla2.jpg" target="_blank">
  <img src="Layla2.jpg" width="400" alt="Layla2">
</a>

</body>
</html>
