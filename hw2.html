<!DOCTYPE html>
<html>
<head>
  <title>Homework #2</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="this is the second homework assigment for FA25 MEDP150">

  <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
  <style>
    body {
      margin:0;
      padding:0;
      background:#DCD0FF;
      font-family:"Times New Roman", serif;
      color:#2b2340;
      min-height:100vh;
      padding-left:60px;
      box-sizing:border-box;
    }

    ::-webkit-scrollbar { width: 14px; }
    ::-webkit-scrollbar-track {
      background: #efe8ff;
      border-left: 1px solid rgba(0,0,0,0.03);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #c4a8ff, #8c63ff);
      border-radius: 12px;
      border: 3px solid #efe8ff;
    }
    scrollbar-width: thin;
    scrollbar-color: #8c63ff #efe8ff;

    .scrollbar {
      position: fixed;
      top:0;
      left:0;
      width:60px;
      height:100%;
      background:#E0D0FF;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding-top:20px;
      z-index:100;
    }

    .scrollbar .heart {
      font-size:30px;
      cursor:pointer;
      color:#FF69B4;
      transition: transform 0.2s;
      user-select:none;
    }

    .nav {
      display:flex;
      gap:18px;
      align-items:center;
      background:#fff;
      padding:10px 16px;
      margin-left:60px;
      position:sticky;
      top:0;
      z-index:90;
      border-bottom:1px solid rgba(0,0,0,0.05);
    }

    .nav a {
      color:#6ea9ff;
      text-decoration:none;
    }

    h1 {
      font-family:'Lobster', cursive;
      margin-left:60px;
    }

    /* ✅ FIXED POLAROID — wraps image size naturally */
    .polaroid {
      display:inline-block;
      background:#fff;
      padding:10px 10px 26px 10px; /* adjusted for landscape images */
      box-shadow:4px 6px 12px rgba(0,0,0,0.15);
      margin:8px;
      border-radius:4px;
      text-align:center;
    }

    .polaroid img {
      width:400px;     /* required width */
      height:auto;     /* keeps original image ratio */
      display:block;
      border-radius:2px;
    }

    .caption {
      font-size:0.9em;
      color:#333;
      margin-top:8px;
    }

    @media (max-width:600px) {
      body { padding-left:0; }
      .scrollbar { display:none; }
      h1, .nav { margin-left:12px; }
    }
  </style>
</head>

<body>
  <div class="scrollbar">
    <div class="heart" title="Like">❤️</div>
  </div>

  <div class="nav">
    <a class="home-link" href="homework.html">Homework</a>
    <a class="home-link" href="readings.html">Readings</a>
    <a class="home-link" href="index.html">Home</a>
  </div>

  <h1>Homework 2: Cropping and Resizing</h1>

  <!-- thumbnails -->
  <div class="polaroid">
    <a href="Flower.jpg"><img src="Flower.jpg" alt="Flower thumbnail"></a>
    <div class="caption">Flower</div>
  </div>

  <div class="polaroid">
    <a href="Layla.jpg"><img src="Layla.jpg" alt="Layla thumbnail"></a>
    <div class="caption">Layla</div>
  </div>

  <img src="Flower.jpg" width="400px" alt="Flower">
  <img src="Flower2.jpg" width="400px" alt="Flower2">
  <img src="Layla.jpg" width="400px" alt="Layla">
  <img src="Layla2.jpg" width="400px" alt="Layla2">

  <p>The two images I chose are: a flower seen through a “dark tunnel” made from a Bounty paper roll, and my pet turtle, Layla (her name for now, depending on gender)...</p>

  <script>
    const heart = document.querySelector('.heart');
    heart && heart.addEventListener('click', () => {
      heart.style.transform = 'scale(1.2)';
      setTimeout(() => heart.style.transform = '', 250);
    });
  </script>
</body>
</html>
