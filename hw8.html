<!DOCTYPE html>
<html>
<head>
  <title>Homework #8</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Homework 8">

  <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
  <style>
    body { margin:0; padding:0; background:#DCD0FF; font-family:"Times New Roman", serif; color:#2b2340; min-height:100vh; padding-left:60px; box-sizing:border-box; }
    ::-webkit-scrollbar { width:14px; }
    ::-webkit-scrollbar-track { background:#efe8ff; border-left:1px solid rgba(0,0,0,0.03); }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #c4a8ff, #8c63ff); border-radius:12px; border:3px solid #efe8ff; }
    scrollbar-width: thin; scrollbar-color: #8c63ff #efe8ff;

    .scrollbar { position: fixed; top:0; left:0; width:60px; height:100%; background:#E0D0FF; display:flex; justify-content:center; align-items:flex-start; padding-top:20px; z-index:100; }
    .scrollbar .heart { font-size:30px; cursor:pointer; color:#FF69B4; transition: transform 0.2s; user-select:none; }

    .nav { display:flex; gap:18px; align-items:center; background:#fff; padding:10px 16px; margin-left:60px; position:sticky; top:0; z-index:90; border-bottom:1px solid rgba(0,0,0,0.05); }
    .nav a { color:#6ea9ff; text-decoration:none; }

    h1 { font-family:'Lobster', cursive; margin-left:60px; }

    .polaroid { display:inline-block; background:#fff; padding:8px 8px 20px 8px; box-shadow:4px 6px 12px rgba(0,0,0,0.15); margin:8px; border-radius:4px; text-align:center; }
    .polaroid img { width:220px; height:auto; display:block; border-radius:2px; }
    .polaroid.main img { width:400px; }
    .caption { font-size:0.9em; color:#333; margin-top:6px; }

    @media (max-width:600px) { body { padding-left:0; } .scrollbar { display:none; } h1, .nav { margin-left:12px; } }
  </style>
</head>
<body>
  <div class="scrollbar"><div class="heart" title="Like">❤️</div></div>

  <div class="nav">
    <a class="home-link" href="homework.html">Homework</a>
    <a class="home-link" href="readings.html">Readings</a>
    <a class="home-link" href="index.html">Home</a>
  </div>

  <h1>Homework 8: 2 Animated Gifs</h1>

 
  <!-- Main images as polaroids -->
  <div class="polaroid main"><img src="Eye2.jpg" alt="Eye2"><div class="caption">Eye2</div></div>
  <div class="polaroid main"><img src="Eye2N.jpg" alt="Eye2N"><div class="caption">Eye2N</div></div>
  <div class="polaroid main"><img src="Eye2C.jpg" alt="Eye2C"><div class="caption">Eye2C</div></div>
  <div class="polaroid main"><img src="eyegif.gif" alt="eyegif"><div class="caption">eyegif</div></div>
  <div class="polaroid main"><img src="ME.jpg" alt="ME"><div class="caption">ME</div></div>
  <div class="polaroid main"><img src="puppet.gif" alt="puppet"><div class="caption">puppet</div></div>

  <script>
    const heart = document.querySelector('.heart');
    heart && heart.addEventListener('click', () => { heart.style.transform = 'scale(1.2)'; setTimeout(() => heart.style.transform = '', 250); });
  </script>
</body>
</html>
